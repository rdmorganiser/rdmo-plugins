name: Render README and JSON

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - run: pip install -r requirements.txt

      - run: make readme json

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain README.md plugins.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md plugins.json
            git commit -m 'Render README.md and plugins.json'
            git push
          fi
