- title: RDMO Sensor AWI optionset plugin
  url: https://github.com/hafu/rdmo-sensor-awi
  description: |
    Queries the Sensor Information System of the Alfred-Wegener-Institut, Helmholtz-Zentrum für Polar- und Meeresforschung (AWI).

