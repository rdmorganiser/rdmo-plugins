- title: ORCID
  url: https://github.com/rdmorganiser/rdmo-plugins-orcid
  maintainer: '@jochenklar'
  status: active
  description: >
    This plugin implements a dynamic option set that queries the expanded-search endpoint of the
    [ORCID public API](https://info.orcid.org/documentation/api-tutorials/api-tutorial-searching-the-orcid-registry/).

- title: ROR
  url: https://github.com/rdmorganiser/rdmo-plugins-ror
  maintainer: '@jochenklar'
  status: active
  description: >
    This plugin implements a dynamic option set that queries the expanded-search endpoint of the
    [ROR API](https://ror.readme.io/docs/rest-api).

- title: GND
  url: https://github.com/rdmorganiser/rdmo-plugins-gnd
  maintainer: '@jochenklar'
  status: active
  description: >
    This plugin implements a dynamic option set that queries the API for the Gemeinsame Normdatei (GND)
    at https://lobid.org/gnd.

- title: Wikidata
  url: https://github.com/rdmorganiser/rdmo-plugins-wikidata
  maintainer: '@jochenklar'
  status: active
  description: >
    This plugin implements a dynamic option set that queries the Wikidata Search API at https://www.wikidata.org/w/api.php.

- title: re3data
  url: https://github.com/rdmorganiser/rdmo-plugins-re3data
  status: inactive
  description: >
    The dynamic re3data optionset will query [re3data.org](https://www.re3data.org/) for repositories
    that match the research field of the project (as given by the `project/research_field/title` attribute).

- title: maDMP
  url: https://github.com/rdmorganiser/rdmo-plugins-madmp
  status: inactive
  description: >
    This repo contains and export and an import plugin to provide interoperability of [RDMO](https://github.com/rdmorganiser/rdmo)
    with the [RDA-DMP-Common-Standard (maDMP)](https://github.com/RDA-DMP-Common/RDA-DMP-Common-Standard).

- title: DataCite
  url: https://github.com/rdmorganiser/rdmo-plugins-datacite
  maintainer: '@jochenklar'
  status: active
  description: >
    This repo contains and export and an import plugin to provide interoperability of [RDMO](https://github.com/rdmorganiser/rdmo)
    with [DataCite](https://datacite.org/).

- title: RADAR
  url: https://github.com/rdmorganiser/rdmo-plugins-radar
  maintainer: '@MyPyDavid'
  status: active
  description: >
    This repo implements several plugins to connect [RDMO](https://github.com/rdmorganiser/rdmo)
    with [RADAR](https://www.radar-service.eu/). The export plugin uses [OAUTH 2.0](https://oauth.net/2/), so that users use
    their respective accounts in both systems.

- title: Zenodo
  url: https://github.com/rdmorganiser/rdmo-plugins-zenodo
  maintainer: '@jochenklar'
  status: active
  description: >
    This plugin implements an [export provider](https://rdmo.readthedocs.io/en/latest/plugins/index.html#export-providers)
    for RDMO, which lets users push metadata from RDMO to Zenodo. The plugin uses
    [OAUTH 2.0](https://oauth.net/2/), so that users use their respective accounts in both systems.
    It creates only the metadata in Zenodo, so users need to upload the actual data to Zenodo themselves.

- title: GitHub
  url: https://github.com/rdmorganiser/rdmo-plugins-github
  status: active
  description: >
    The plugin implements an [issue provider](https://rdmo.readthedocs.io/en/latest/plugins/index.html#issue-providers),
    which lets users push their tasks from RDMO to GitHub issues, and an
    [project import plugin](https://rdmo.readthedocs.io/en/latest/plugins/index.html#project-import-plugins),
    which can be used to import projects from (public or private) repos.
    The plugin uses [OAUTH 2.0](https://oauth.net/2/), so that users use their respective accounts in both systems.

- title: GitLab
  url: https://github.com/rdmorganiser/rdmo-plugins-gitlab
  status: active
  description: >
    The plugin implements an [issue provider](https://rdmo.readthedocs.io/en/latest/plugins/index.html#issue-providers),
    which lets users push their tasks from RDMO to GitLab issues, and an
    [project import plugin](https://rdmo.readthedocs.io/en/latest/plugins/index.html#project-import-plugins),
    which can be used to import projects from (public or private) repos.
    The plugin uses [OAUTH 2.0](https://oauth.net/2/), so that users use their respective accounts in both systems.

- title: OpenProject
  url: https://github.com/rdmorganiser/rdmo-plugins-openproject
  maintainer: '@jochenklar'
  status: active
  description: >
    This plugin implements an [issue provider](https://rdmo.readthedocs.io/en/latest/plugins/index.html#issue-providers)
    for RDMO, which lets users push their tasks from RDMO to OpenProject work packages. The plugin uses
    [OAUTH 2.0](https://oauth.net/2/), so that users use their respective accounts in both systems.
