- title: ORCID
  url: https://github.com/rdmorganiser/rdmo-plugins-orcid
  maintainer: '@jochenklar'
  status: active
  type:
    - OptionSetProvider
  description: >
    Queries the expanded-search endpoint of the
    [ORCID public API](https://info.orcid.org/documentation/api-tutorials/api-tutorial-searching-the-orcid-registry/).

- title: ROR
  url: https://github.com/rdmorganiser/rdmo-plugins-ror
  maintainer: '@jochenklar'
  status: active
  type:
    - OptionSetProvider
  description: >
    Queries the expanded-search endpoint of the [ROR API](https://ror.readme.io/docs/rest-api).

- title: GND
  url: https://github.com/rdmorganiser/rdmo-plugins-gnd
  maintainer: '@jochenklar'
  status: active
  type:
    - OptionSetProvider
  description: >
    Queries the API for the Gemeinsame Normdatei (GND) at https://lobid.org/gnd.

- title: Wikidata
  url: https://github.com/rdmorganiser/rdmo-plugins-wikidata
  maintainer: '@jochenklar'
  status: active
  type:
    - OptionSetProvider
  description: >
    Queries the Wikidata Search API at https://www.wikidata.org/w/api.php.

- title: re3data
  url: https://github.com/rdmorganiser/rdmo-plugins-re3data
  status: inactive
  type:
    - OptionSetProvider
  description: >
    Queries [re3data.org](https://www.re3data.org/) for repositories that match the research field of the project
    (as given by the `project/research_field/title` attribute).

- title: maDMP
  url: https://github.com/rdmorganiser/rdmo-plugins-madmp
  status: inactive
  type:
    - Export
    - Import
  description: >
    Provides interoperability of [RDMO](https://github.com/rdmorganiser/rdmo)
    with the [RDA-DMP-Common-Standard (maDMP)](https://github.com/RDA-DMP-Common/RDA-DMP-Common-Standard).

- title: DataCite
  url: https://github.com/rdmorganiser/rdmo-plugins-datacite
  maintainer: '@jochenklar'
  status: active
  type:
    - Export
    - Import
  description: >
    Provides interoperability of [RDMO](https://github.com/rdmorganiser/rdmo) with [DataCite](https://datacite.org/).

- title: RADAR
  url: https://github.com/rdmorganiser/rdmo-plugins-radar
  maintainer: '@MyPyDavid'
  status: active
  type:
    - Export
  description: >
    Pushes metadata from RDMO to [RADAR](https://www.radar-service.eu/). Users need to upload the actual data to Zenodo themselves.
    The export uses [OAUTH 2.0](https://oauth.net/2/), so that users use their respective accounts in both systems.

- title: Zenodo
  url: https://github.com/rdmorganiser/rdmo-plugins-zenodo
  maintainer: '@jochenklar'
  status: active
  type:
    - Export
  description: >
    Pushes metadata from RDMO to [Zenodo](https://zenodo.org). Users need to upload the actual data to Zenodo themselves.
    Uses [OAUTH 2.0](https://oauth.net/2/), so that users use their respective accounts in both systems.

